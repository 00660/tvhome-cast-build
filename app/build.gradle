plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34
    ndkVersion '21.4.7075529'

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 19
        targetSdk 34
        versionCode 7
        versionName '2.6'
        ndk { abiFilters 'armeabi-v7a' }
        multiDexEnabled true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // QR generation for the upload-by-QR wallpaper screen; bundled locally so the build stays offline.
    implementation files('libs/core-3.5.3.jar')
    // libVLC (FFmpeg-based): software-decodes HD FLV/HLS/MP4 that this TV's hardware codec cannot
    // handle. Supports Android 4.4 (API17+). This is what lets high-bitrate cast streams play.
    implementation 'org.videolan.android:libvlc-all:3.6.2'
    // HomeKit Accessory Protocol (HAP), pure-Java. Provides the Television media accessory.
    implementation 'io.github.hap-java:hap:2.0.7'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.51'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
