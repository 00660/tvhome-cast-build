plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34
    ndkVersion '21.4.7075529'

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 19
        targetSdk 34
        versionCode 7
        versionName '2.6'
        ndk { abiFilters 'armeabi-v7a' }
        multiDexEnabled true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE',
                         'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**', 'META-INF/io.netty.versions.properties', 'META-INF/*']
        }
    }

    buildTypes {
        release {
            // NOTE: R8/API-modeling breaks desugar's java.util.concurrent.CompletableFuture backport on
            // API19 (HomeKit crashed with NoClassDefFoundError). Keep shrinking off so desugaring works.
            minifyEnabled false
            shrinkResources false
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // QR generation for the upload-by-QR wallpaper screen; bundled locally so the build stays offline.
    implementation files('libs/core-3.5.3.jar')
    // libVLC (FFmpeg-based): software-decodes HD FLV/HLS/MP4 that this TV's hardware codec cannot
    // handle. Supports Android 4.4 (API17+). This is what lets high-bitrate cast streams play.
    implementation 'org.videolan.android:libvlc-all:3.6.2'
    // HomeKit Accessory Protocol implemented from spec (com.gathin.tvhome.hk) using BouncyCastle
    // primitives: SRP6a, X25519, Ed25519, ChaCha20-Poly1305, HKDF. All available in bcprov 1.70.
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'dev.mobile:dadb:2.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
