name: Build TV Home + Cast APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake + platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Build OpenSSL for armeabi-v7a
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          curl -sSL -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz
          tar xzf openssl.tar.gz
          cd openssl-3.0.15
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          if [ -z "$ANDROID_NDK_ROOT" ]; then export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125; fi
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          PREFIX=$GITHUB_WORKSPACE/app/src/main/jni/openssl/armeabi-v7a
          ./Configure android-arm -D__ANDROID_API__=21 no-shared no-tests no-ui-console no-apps --prefix=$PREFIX
          make -j4
          make install_sw
          echo "openssl installed to $PREFIX"
          ls $PREFIX/lib

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-cast-apk
          path: app/build/outputs/apk/release/*.apk
