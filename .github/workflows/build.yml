name: Build TV Home + Cast APK (API19)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK r21e (supports Android 4.4 / API19 native builds)
        run: |
          set -e
          cd "$ANDROID_HOME"
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          mkdir -p "$ANDROID_HOME/ndk"
          mv /tmp/ndk/android-ndk-r21e "$ANDROID_HOME/ndk/21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          "$ANDROID_HOME/ndk/21.4.7075529/ndk-build" --version || true

      - name: Build OpenSSL for armeabi-v7a (API19)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          curl -sSL -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz
          tar xzf openssl.tar.gz
          cd openssl-3.0.15
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          PREFIX=$GITHUB_WORKSPACE/app/src/main/jni/openssl/armeabi-v7a
          ./Configure android-arm -D__ANDROID_API__=19 no-shared no-tests --prefix=$PREFIX >/dev/null 2>&1
          make -j4 >/tmp/ossl_make.log 2>&1 || { echo "OPENSSL MAKE FAILED"; tail -40 /tmp/ossl_make.log; exit 1; }
          make install_sw >/dev/null 2>&1
          echo "openssl installed (API19):"; ls -la $PREFIX/lib

      - name: Build FFmpeg for armeabi-v7a (API19, soft decode)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          curl -sSL -o ffmpeg.tar.gz https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n6.1.tar.gz
          tar xzf ffmpeg.tar.gz
          cd FFmpeg-n6.1
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          API=19; ARCH=arm; CPU=armv7-a; CROSS=armv7a-linux-androideabi
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          PREFIX=$GITHUB_WORKSPACE/app/src/main/jni/ffmpeg/armeabi-v7a
          OPENSSL=$GITHUB_WORKSPACE/app/src/main/jni/openssl/armeabi-v7a
          ./configure --prefix=$PREFIX \
            --target-os=android --arch=$ARCH --cpu=$CPU \
            --enable-cross-compile --cc=$TOOLCHAIN/bin/${CROSS}${API}-clang \
            --cxx=$TOOLCHAIN/bin/${CROSS}${API}-clang++ --ar=$TOOLCHAIN/bin/llvm-ar \
            --nm=$TOOLCHAIN/bin/llvm-nm --strip=$TOOLCHAIN/bin/llvm-strip \
            --enable-static --disable-shared --disable-programs --disable-doc \
            --disable-avdevice --disable-avfilter --disable-postproc --enable-swresample \
            --disable-encoders --disable-muxers --disable-bsfs --disable-devices --disable-filters \
            --enable-decoder=h264,hevc,aac,mp3,flv,vp8,vp9,mpeg4,mjpeg \
            --enable-demuxer=mov,flv,mpegts,h264,hevc,aac,mp3,matroska,image2,mpjpeg \
            --enable-parser=h264,hevc,aac,mpegaudio,flv,vp8,vp9 \
            --enable-protocol=file,http,tcp,https,pipe \
            --enable-openssl --disable-symver \
            --extra-cflags="-I$OPENSSL/include -D__ANDROID_API__=$API" \
            --extra-ldflags="-L$OPENSSL/lib -D__ANDROID_API__=$API -lcrypto -lssl -lz" \
            --enable-small >/tmp/ff_conf.log 2>&1 || { echo FFCONF_FAIL; tail -50 /tmp/ff_conf.log; exit 1; }
          make -j4 >/tmp/ff_make.log 2>&1 || { echo FFMAKE_FAIL; tail -60 /tmp/ff_make.log; exit 1; }
          make install >/tmp/ff_inst.log 2>&1 || { echo FFINST_FAIL; tail -40 /tmp/ff_inst.log; exit 1; }
          echo "ffmpeg installed:"; ls -la $PREFIX/lib

      - name: Build APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle.log || true
          if grep -q "BUILD SUCCESSFUL" /tmp/gradle.log; then echo "GRADLE OK"; else
            echo "===== GRADLE ERRORS ====="
            grep -nE "error:|CMake Error|ninja: error|undefined reference|Execution failed|What went wrong|FAILED|ld: |cannot find|No such file|fatal error" /tmp/gradle.log | tail -80
            echo "===== END ====="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-cast-apk
          path: app/build/outputs/apk/release/*.apk
